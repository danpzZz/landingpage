version: '3.9'

services:
  daniel:
    image: "colocar imagen del repositorio"
    networks: 
      - traefik-public
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.daniel.entrypoints=http"
        - "traefik.http.routers.daniel.rule=Host(`daniel.byronrm.com`)"
        - "traefik.http.middlewares.daniel-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.daniel.middlewares=daniel-https-redirect"
        - "traefik.http.routers.daniel-secure.entrypoints=https"
        - "traefik.http.routers.daniel-secure.rule=Host(`daniel.byronrm.com`)"
        - "traefik.http.routers.daniel-secure.tls=true"
        - "traefik.http.routers.daniel-secure.tls.certresolver=http"
        - "traefik.http.routers.daniel-secure.service=daniel"
        - "traefik.http.services.daniel.loadbalancer.server.port=5000"
        - "traefik.docker.network=traefik-public"
networks: 
  - traefik-public :
      external : true